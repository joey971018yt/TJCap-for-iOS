name: Windows x64 MSVC App & Installer Build (TJCap for iOS)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msvc-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Visual Studio x64)
        run: cmake -S . -B build-msvc -A x64

      - name: Build Release binaries (MSVC with CFG / CET / High-Entropy ASLR / DEP)
        run: cmake --build build-msvc --config Release --parallel

      - name: Run protocol, USB speed gating, updater & media pipeline unit tests on Windows
        run: .\build-msvc\Release\ios_vcam_tests.exe

      - name: Stage native MSVC App & Portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-msvc-win64\drivers" | Out-Null
          Copy-Item "build-msvc\Release\ios_vcam_gui.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_gui.exe" "release-msvc-win64\TJCap for iOS.exe"
          Copy-Item "build-msvc\Release\ios_vcam_dshow.dll" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_host.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_driver_setup.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_tests.exe" "release-msvc-win64\"
          Copy-Item "scripts\install_all_admin.ps1" "release-msvc-win64\"
          Copy-Item "scripts\uninstall_all_admin.ps1" "release-msvc-win64\"
          Copy-Item "README.md" "release-msvc-win64\"
          Copy-Item "CHANGELOG.md" "release-msvc-win64\"
          Copy-Item "THIRD_PARTY_NOTICES.md" "release-msvc-win64\"
          if (Test-Path "dist-win64\libusb-1.0.dll") {
            Copy-Item "dist-win64\libusb-1.0.dll" "release-msvc-win64\"
          }
          if (Test-Path "dist-win64\drivers\*") {
            Copy-Item "dist-win64\drivers\*" "release-msvc-win64\drivers\"
          }

          # Create clean Portable App ZIP (TJCap-for-iOS-Portable-v2.0.0.zip)
          New-Item -ItemType Directory -Force -Path "build-installer\TJCap-for-iOS" | Out-Null
          Copy-Item "release-msvc-win64\TJCap for iOS.exe" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_gui.exe" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_host.exe" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_driver_setup.exe" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_dshow.dll" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\libusb-1.0.dll" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\README.md" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\CHANGELOG.md" "build-installer\TJCap-for-iOS\"
          Copy-Item "release-msvc-win64\THIRD_PARTY_NOTICES.md" "build-installer\TJCap-for-iOS\"
          Copy-Item -Recurse "release-msvc-win64\drivers" "build-installer\TJCap-for-iOS\drivers"
          Compress-Archive -Path "build-installer\TJCap-for-iOS" -DestinationPath "build-installer\TJCap-for-iOS-Portable-v2.0.0.zip" -Force

      - name: Build Windows App Setup.exe via Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\ios_usb_capture.iss"

      - name: Upload native MSVC binaries & TJCap for iOS App packages
        uses: actions/upload-artifact@v4
        with:
          name: tjcap-for-ios-app-packages
          path: |
            release-msvc-win64/
            build-installer/TJCap-for-iOS-Setup-v2.0.0.exe
            build-installer/TJCap-for-iOS-Portable-v2.0.0.zip

      - name: Publish TJCap for iOS Setup.exe & Portable.zip to GitHub Release v2.0.0
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          ## 🚀 TJCap for iOS v2.0.0 — 正式更名「TJCap for iOS」全新啟航！

          > 💡 **舊版 `JCast for iOS` 正式升級更名為 `TJCap for iOS`！**
          > - **正式安裝版 (`Setup.exe`) 用戶**：直接在舊版 App 內點擊「⬆️ 升級 v2.0.0」即可**一鍵無縫覆蓋升級**（自動替換桌面／開始選單捷徑、保留既有語言設定與相同 DirectShow 底層 COM CLSID！）。
          > - **免安裝便攜版 (`Portable.zip`) 用戶**：因主程式正式更名為 `TJCap for iOS.exe`，建議直接下載下方新版 **`TJCap-for-iOS-Portable-v2.0.0.zip`** 解壓使用。
          > *(Formerly **JCast for iOS** — officially rebranded to **TJCap for iOS**! Installer users can upgrade seamlessly in one click; portable users should extract the new Portable ZIP.)*

          ### ✨ v2.0.0 正式更名與升級內容 / What's New
          - **🏷️ 全面正式更名為 `TJCap for iOS`**：
            - 主程式、Windows 安裝程式、免安裝便攜包與官方 GitHub 專案全面切換至 **`TJCap for iOS`** (`joey971018yt/TJCap-for-iOS`)。
            - **DirectShow 虛擬擷取卡正式名稱**：**`TJCap for iOS (Video)`** 與 **`TJCap for iOS (Audio)`**（保留完全相同的底層 COM `CLSID`，並自動與既有 OBS 場景銜接）。
            - **診斷錯誤碼與工具全面同步**：故障碼更新為 **`TJCAP-E101` ～ `TJCAP-E503`**（向下相容舊版 `JCAST-` 解析）、截圖資料夾更新為 **`圖片\TJCap Screenshots`**（檔名前綴 `TJCap_`）、獨立外接大視窗更新為 **`TJCap Live Monitor`**。
          - **🔄 無縫舊版資料與偏好自動繼承**：
            - 語系設定登錄檔遷移至 `HKCU\Software\TJCapForiOS`，首次啟動會自動繼承舊版 `JCastForiOS` 的語言設定；安裝程式自動清理舊版 `JCast for iOS.exe` 與殘留捷徑。

          ---

          ### 📦 下載檔案說明 / Downloads
          1. **推薦下載 / Recommended：`TJCap-for-iOS-Setup-v2.0.0.exe`** (Windows Installer)
          2. **免安裝便攜版 / Portable：`TJCap-for-iOS-Portable-v2.0.0.zip`** (No-install Portable ZIP)
          "@
          gh release view v2.0.0 >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release edit v2.0.0 `
              --title "TJCap for iOS v2.0.0 (正式更名 TJCap for iOS — 全新品牌版本)" `
              --notes $notes
            gh release upload v2.0.0 `
              "build-installer\TJCap-for-iOS-Setup-v2.0.0.exe" `
              "build-installer\TJCap-for-iOS-Portable-v2.0.0.zip" `
              --clobber
          } else {
            gh release create v2.0.0 `
              "build-installer\TJCap-for-iOS-Setup-v2.0.0.exe" `
              "build-installer\TJCap-for-iOS-Portable-v2.0.0.zip" `
              --title "TJCap for iOS v2.0.0 (正式更名 TJCap for iOS — 全新品牌版本)" `
              --notes $notes
          }

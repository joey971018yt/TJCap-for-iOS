name: Windows x64 MSVC App & Installer Build (JCast for iOS)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msvc-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Visual Studio x64)
        run: cmake -S . -B build-msvc -A x64

      - name: Build Release binaries (MSVC with CFG / CET / High-Entropy ASLR / DEP)
        run: cmake --build build-msvc --config Release --parallel

      - name: Run protocol, USB speed gating, updater & media pipeline unit tests on Windows
        run: .\build-msvc\Release\ios_vcam_tests.exe

      - name: Stage native MSVC App & Portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-msvc-win64\drivers" | Out-Null
          Copy-Item "build-msvc\Release\ios_vcam_gui.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_gui.exe" "release-msvc-win64\JCast for iOS.exe"
          Copy-Item "build-msvc\Release\ios_vcam_dshow.dll" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_host.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_driver_setup.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_tests.exe" "release-msvc-win64\"
          Copy-Item "scripts\install_all_admin.ps1" "release-msvc-win64\"
          Copy-Item "scripts\uninstall_all_admin.ps1" "release-msvc-win64\"
          Copy-Item "README.md" "release-msvc-win64\"
          Copy-Item "CHANGELOG.md" "release-msvc-win64\"
          Copy-Item "THIRD_PARTY_NOTICES.md" "release-msvc-win64\"
          if (Test-Path "dist-win64\libusb-1.0.dll") {
            Copy-Item "dist-win64\libusb-1.0.dll" "release-msvc-win64\"
          }
          if (Test-Path "dist-win64\drivers\*") {
            Copy-Item "dist-win64\drivers\*" "release-msvc-win64\drivers\"
          }

          # Create clean Portable App ZIP (JCast-for-iOS-Portable-v1.9.0.zip)
          New-Item -ItemType Directory -Force -Path "build-installer\JCast-for-iOS" | Out-Null
          Copy-Item "release-msvc-win64\JCast for iOS.exe" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_gui.exe" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_host.exe" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_driver_setup.exe" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\ios_vcam_dshow.dll" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\libusb-1.0.dll" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\README.md" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\CHANGELOG.md" "build-installer\JCast-for-iOS\"
          Copy-Item "release-msvc-win64\THIRD_PARTY_NOTICES.md" "build-installer\JCast-for-iOS\"
          Copy-Item -Recurse "release-msvc-win64\drivers" "build-installer\JCast-for-iOS\drivers"
          Compress-Archive -Path "build-installer\JCast-for-iOS" -DestinationPath "build-installer\JCast-for-iOS-Portable-v1.9.0.zip" -Force

      - name: Build Windows App Setup.exe via Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\ios_usb_capture.iss"

      - name: Upload native MSVC binaries & JCast for iOS App packages
        uses: actions/upload-artifact@v4
        with:
          name: jcast-for-ios-app-packages
          path: |
            release-msvc-win64/
            build-installer/JCast-for-iOS-Setup-v1.9.0.exe
            build-installer/JCast-for-iOS-Portable-v1.9.0.zip

      - name: Publish JCast for iOS Setup.exe & Portable.zip to GitHub Release v1.9.0
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          ## 🌐 JCast for iOS v1.9.0 — 介面語言設定選項（繁體中文 / English）即時無縫切換

          > 💡 **如果您已安裝 `v1.5.0` ～ `v1.8.0`，直接開啟 App 點擊「⬆️ 升級 v1.9.0」即可一鍵自動升級！**
          > *(If you already have v1.5.0–v1.8.0 installed, click **Update v1.9.0** inside the app to upgrade in one click!)*

          ### ✨ v1.9.0 全新功能亮點 / What's New
          - **🌐 新增介面語言設定選單 (`🌐 語言 / Language`)**：
            - 內建 **「🌐 自動 (跟隨系統) / Auto (System)」**、**「繁體中文」** 與 **「English」** 三段模式；首次啟動會依 Windows 系統顯示語言自動選擇，且偏好設定安全儲存於使用者登錄檔（`HKCU\Software\JCastForiOS`，免管理員權限）。
            - **免重啟即時切換（Live Switching）**：即使正在直播擷取途中，切換語言也會**即時無縫更新**整個控制台介面、解析度／音訊／狀態列下拉選單、狀態橫幅、4 欄式即時串流健康度儀表板、獨立大視窗（標題列、全螢幕 HUD、右鍵選單），完全不中斷串流！
          - **🩺 完整雙語化診斷中心與自動更新視窗**：
            - 全數 18 組故障錯誤碼（`JCAST-E101` ～ `JCAST-E503`）根因解析與逐步修復指南、8 項系統自檢報告、程序結束碼說明、GitHub Issue 一鍵報錯範本、OBS 設定教學與軟體更新對話框皆完整支援 **繁體中文** 與 **English**！

          ---

          ### 📦 下載檔案說明 / Downloads
          1. **推薦下載 / Recommended：`JCast-for-iOS-Setup-v1.9.0.exe`** (Windows Installer)
          2. **免安裝便攜版 / Portable：`JCast-for-iOS-Portable-v1.9.0.zip`** (No-install Portable ZIP)
          "@
          gh release view v1.9.0 >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release edit v1.9.0 `
              --title "JCast for iOS v1.9.0 (語言設定選項：繁體中文 / English 即時切換)" `
              --notes $notes
            gh release upload v1.9.0 `
              "build-installer\JCast-for-iOS-Setup-v1.9.0.exe" `
              "build-installer\JCast-for-iOS-Portable-v1.9.0.zip" `
              --clobber
          } else {
            gh release create v1.9.0 `
              "build-installer\JCast-for-iOS-Setup-v1.9.0.exe" `
              "build-installer\JCast-for-iOS-Portable-v1.9.0.zip" `
              --title "JCast for iOS v1.9.0 (語言設定選項：繁體中文 / English 即時切換)" `
              --notes $notes
          }

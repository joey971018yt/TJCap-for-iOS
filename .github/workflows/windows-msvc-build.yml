name: Windows x64 MSVC App & Installer Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-msvc-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Visual Studio x64)
        run: cmake -S . -B build-msvc -A x64

      - name: Build Release binaries (MSVC)
        run: cmake --build build-msvc --config Release --parallel

      - name: Run protocol & media pipeline unit tests on Windows
        run: .\build-msvc\Release\ios_vcam_tests.exe

      - name: Stage native MSVC App & Portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-msvc-win64\drivers" | Out-Null
          Copy-Item "build-msvc\Release\ios_vcam_gui.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_gui.exe" "release-msvc-win64\iOS USB Capture.exe"
          Copy-Item "build-msvc\Release\ios_vcam_dshow.dll" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_host.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_driver_setup.exe" "release-msvc-win64\"
          Copy-Item "build-msvc\Release\ios_vcam_tests.exe" "release-msvc-win64\"
          Copy-Item "scripts\install_all_admin.ps1" "release-msvc-win64\"
          Copy-Item "scripts\uninstall_all_admin.ps1" "release-msvc-win64\"
          Copy-Item "README.md" "release-msvc-win64\"
          Copy-Item "CHANGELOG.md" "release-msvc-win64\"
          if (Test-Path "dist-win64\libusb-1.0.dll") {
            Copy-Item "dist-win64\libusb-1.0.dll" "release-msvc-win64\"
          }
          if (Test-Path "dist-win64\drivers\*") {
            Copy-Item "dist-win64\drivers\*" "release-msvc-win64\drivers\"
          }

          # Create clean Portable App ZIP
          New-Item -ItemType Directory -Force -Path "build-installer\iOS-USB-Capture" | Out-Null
          Copy-Item "release-msvc-win64\iOS USB Capture.exe" "build-installer\iOS-USB-Capture\"
          Copy-Item "release-msvc-win64\ios_vcam_gui.exe" "build-installer\iOS-USB-Capture\"
          Copy-Item "release-msvc-win64\ios_vcam_host.exe" "build-installer\iOS-USB-Capture\"
          Copy-Item "release-msvc-win64\ios_vcam_driver_setup.exe" "build-installer\iOS-USB-Capture\"
          Copy-Item "release-msvc-win64\ios_vcam_dshow.dll" "build-installer\iOS-USB-Capture\"
          Copy-Item "release-msvc-win64\libusb-1.0.dll" "build-installer\iOS-USB-Capture\"
          Copy-Item "release-msvc-win64\README.md" "build-installer\iOS-USB-Capture\"
          Copy-Item "release-msvc-win64\CHANGELOG.md" "build-installer\iOS-USB-Capture\"
          Copy-Item -Recurse "release-msvc-win64\drivers" "build-installer\iOS-USB-Capture\drivers"
          Compress-Archive -Path "build-installer\iOS-USB-Capture" -DestinationPath "build-installer\iOS-USB-Capture-Portable-v1.3.0.zip" -Force

      - name: Build Windows App Setup.exe via Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\ios_usb_capture.iss"

      - name: Upload native MSVC binaries & App Installer packages
        uses: actions/upload-artifact@v4
        with:
          name: ios-usb-vcam-app-packages
          path: |
            release-msvc-win64/
            build-installer/iOS-USB-Capture-Setup-v1.3.0.exe
            build-installer/iOS-USB-Capture-Portable-v1.3.0.zip
